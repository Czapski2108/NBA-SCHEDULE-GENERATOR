name: Generate Daily NBA Betting Graphic

on:
  schedule:
    # Runs every day at 8:00 AM EST (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows you to run it manually from GitHub anytime

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run generation script
        run: python generate_schedule.py
        python generate_nfl_schedule.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push generated graphic
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add output/
          git commit -m "Auto-generate daily NBA betting graphic [skip ci]" || exit 0
          git push

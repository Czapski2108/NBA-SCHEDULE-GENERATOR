
    <!DOCTYPE html>

    <head>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
        <style>
            body {
                background: radial-gradient(circle at 50% 8%, #1b56b8 0%, #071b42 55%, #020817 100%);
                color: white;
                font-family: 'Oswald', sans-serif;
                width: 1080px;
                height: 1350px;
                margin: 0;
                padding: 45px 55px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            h1 {
                font-family: 'Anton', sans-serif;
                font-size: 92px;
                letter-spacing: 3px;
                margin: 0 0 25px 0;
                text-transform: uppercase;
                text-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
            }
            .column-headers {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 45px;
                width: 100%;
                margin-bottom: 8px;
            }
            .header-labels {
                display: flex;
                justify-content: space-around;
                font-size: 22px;
                font-weight: 700;
                letter-spacing: 1.5px;
                color: #e2e8f0;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 28px 45px;
                width: 100%;
            }
            .card {
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
                border: 2px solid rgba(255, 255, 255, 0.25);
                background: #0f172a;
                border-radius: 6px;
                overflow: hidden;
            }
            .logo-banner {
                display: flex;
                height: 110px;
                position: relative;
                overflow: hidden;
            }
            .team-half {
                width: 50%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                overflow: hidden;
            }
            .team-half::after {
                content: '';
                position: absolute;
                inset: 0;
                box-shadow: inset 0 0 25px rgba(0,0,0,0.4);
            }
            .team-logo {
                width: 130px;
                height: 130px;
                object-fit: contain;
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
                z-index: 2;
            }
            .divider {
                width: 3px;
                background: rgba(255, 255, 255, 0.4);
                z-index: 3;
            }
            .odds-bar {
                background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
                color: #0f172a;
                height: 52px;
                display: flex;
                justify-content: space-around;
                align-items: center;
                font-size: 28px;
                font-weight: 700;
                border-top: 2px solid #94a3b8;
            }
            .footer {
                margin-top: auto;
                font-family: Arial, sans-serif;
                font-size: 13px;
                color: #94a3b8;
                text-align: center;
                line-height: 1.4;
            }
        </style>
    </head>

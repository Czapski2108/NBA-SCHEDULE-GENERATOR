
    <!DOCTYPE html>
    <html>
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
        <style>
            body {
                background: radial-gradient(circle at 50% 8%, #1b56b8 0%, #071b42 55%, #020817 100%);
                color: white;
                font-family: 'Oswald', sans-serif;
                width: 1080px;
                height: 1350px;
                margin: 0;
                padding: 35px 50px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow: hidden;
            }
            h1 {
                font-family: 'Anton', sans-serif;
                font-size: 76px;
                letter-spacing: 2px;
                margin: 0 0 15px 0;
                text-transform: uppercase;
                text-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
            }
            .column-headers {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 40px;
                width: 100%;
                margin-bottom: 6px;
            }
            .header-labels {
                display: flex;
                justify-content: space-around;
                font-size: 20px;
                font-weight: 700;
                letter-spacing: 1px;
                color: #cbd5e1;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px 40px; /* Reduced vertical gap to safely pack up to 15 games */
                width: 100%;
            }
            .card {
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
                border: 2px solid rgba(255, 255, 255, 0.2);
                background: #0f172a;
                border-radius: 4px;
                overflow: hidden;
            }
            .logo-banner {
                display: flex;
                height: 72px; /* Slightly compacted banner height for heavy slates */
                position: relative;
                overflow: hidden;
            }
            .team-half {
                width: 50%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                overflow: hidden;
            }
            .team-half::after {
                content: '';
                position: absolute;
                inset: 0;
                box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            }
            .team-logo {
                width: 90px;
                height: 90px;
                object-fit: contain;
                filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
                z-index: 2;
            }
            .divider {
                width: 2px;
                background: rgba(255, 255, 255, 0.4);
                z-index: 3;
            }
            .odds-bar {
                background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
                color: #0f172a;
                height: 38px; /* Compact odds bar for high-density slates */
                display: flex;
                justify-content: space-around;
                align-items: center;
                font-size: 22px;
                font-weight: 700;
                border-top: 1px solid #94a3b8;
            }
            .footer {
                margin-top: auto;
                font-family: Maison Neue Extended, sans-serif;
                font-size: 12px;
                color: #94a3b8;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>TODAY'S GAMES (4)</h1>
        <div class="column-headers">
            <div class="header-labels"><span>AWAY</span><span>O/U</span><span>HOME</span></div>
            <div class="header-labels"><span>AWAY</span><span>O/U</span><span>HOME</span></div>
        </div>
        <div class="grid">
            
        <div class="card">
            <div class="logo-banner">
                <div class="team-half" style="background-color: #1D428A;">
                    <img src="https://a.espncdn.com/i/teamlogos/nba/500/gs.png" class="team-logo" />
                </div>
                <div class="divider"></div>
                <div class="team-half" style="background-color: #5D76A9;">
                    <img src="https://a.espncdn.com/i/teamlogos/nba/500/mem.png" class="team-logo" />
                </div>
            </div>
            <div class="odds-bar">
                <span>+6.5</span>
                <span class="ou-val">226.5</span>
                <span>-6.5</span>
            </div>
        </div>
        
        <div class="card">
            <div class="logo-banner">
                <div class="team-half" style="background-color: #C8102E;">
                    <img src="https://a.espncdn.com/i/teamlogos/nba/500/lac.png" class="team-logo" />
                </div>
                <div class="divider"></div>
                <div class="team-half" style="background-color: #C4CED4;">
                    <img src="https://a.espncdn.com/i/teamlogos/nba/500/sa.png" class="team-logo" />
                </div>
            </div>
            <div class="odds-bar">
                <span>+15.5</span>
                <span class="ou-val">225.5</span>
                <span>-15.5</span>
            </div>
        </div>
        
        <div class="card">
            <div class="logo-banner">
                <div class="team-half" style="background-color: #E03A3E;">
                    <img src="https://a.espncdn.com/i/teamlogos/nba/500/por.png" class="team-logo" />
                </div>
                <div class="divider"></div>
                <div class="team-half" style="background-color: #00471B;">
                    <img src="https://a.espncdn.com/i/teamlogos/nba/500/mil.png" class="team-logo" />
                </div>
            </div>
            <div class="odds-bar">
                <span>-9.5</span>
                <span class="ou-val">227.5</span>
                <span>+9.5</span>
            </div>
        </div>
        
        <div class="card">
            <div class="logo-banner">
                <div class="team-half" style="background-color: #006BB6;">
                    <img src="https://a.espncdn.com/i/teamlogos/nba/500/ny.png" class="team-logo" />
                </div>
                <div class="divider"></div>
                <div class="team-half" style="background-color: #0c2340;">
                    <img src="https://a.espncdn.com/i/teamlogos/nba/500/min.png" class="team-logo" />
                </div>
            </div>
            <div class="odds-bar">
                <span>-1.5</span>
                <span class="ou-val">216.5</span>
                <span>+1.5</span>
            </div>
        </div>
        
        </div>
        <div class="footer">
            Gambling Problem? Call 1-800-GAMBLER. Odds subject to change.
        </div>
    </body>
    </html>
